name: Supabase database check

on:
  workflow_dispatch:
  schedule:
    # UTC: three reads every day, with different times on each weekday.
    - cron: '17 5,13,21 * * 1'
    - cron: '41 3,11,19 * * 2'
    - cron: '23 6,14,22 * * 3'
    - cron: '53 4,12,20 * * 4'
    - cron: '31 2,10,18 * * 5'
    - cron: '47 5,13,21 * * 6'
    - cron: '11 4,12,20 * * 0'

permissions:
  contents: read

concurrency:
  group: supabase-database-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test database checker
        run: node --test scripts/supabase-keepalive.test.mjs
      - name: Read one database record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/supabase-keepalive.mjs
